<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DialSpace SpeedTest</title>
<style>
  :root {
    --bg: #07070e;
    --surface: rgba(255,255,255,0.05);
    --surface-2: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.12);
    --text: #f0f0f0;
    --muted: rgba(255,255,255,0.48);
    --ok: #79c48f;
    --danger: #e05555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at top, #12122a 0%, var(--bg) 52%);
    color: var(--text);
    font-family: "Rajdhani", Arial, sans-serif;
  }
  body {
    padding: 14px;
  }
  .card {
    height: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 42px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title {
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #fff;
    font-weight: 700;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .metric {
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 10px;
  }
  .metric .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .metric .val {
    margin-top: 6px;
    font-size: 27px;
    letter-spacing: 0.04em;
    color: #fff;
    font-weight: 700;
    line-height: 1;
  }
  .metric .unit {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  #progress-wrap {
    margin-top: 6px;
  }
  #progress-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  #progress {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  #progress > div {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #71a8ff, #90f0c2);
    transition: width .2s ease;
  }
  #hint {
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.35;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  button {
    flex: 1;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.09);
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 11px 10px;
    cursor: pointer;
    transition: all .16s ease;
  }
  button:hover { background: rgba(255,255,255,0.16); }
  button:disabled { opacity: 0.55; cursor: default; }
  #stop-btn {
    color: var(--danger);
    background: rgba(224,85,85,0.12);
  }
  #stop-btn:hover { background: rgba(224,85,85,0.2); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="title">DialSpace SpeedTest</div>
      <div id="status" class="status">Idle</div>
    </div>
    <div class="body">
      <div class="metrics">
        <div class="metric">
          <div class="label">Download</div>
          <div class="val" id="down-val">--</div>
          <div class="unit">Mbps</div>
        </div>
        <div class="metric">
          <div class="label">Upload</div>
          <div class="val" id="up-val">--</div>
          <div class="unit">Mbps</div>
        </div>
        <div class="metric">
          <div class="label">Ping</div>
          <div class="val" id="ping-val">--</div>
          <div class="unit">ms</div>
        </div>
        <div class="metric">
          <div class="label">Quality</div>
          <div class="val" id="qual-val">--</div>
          <div class="unit">score</div>
        </div>
      </div>
      <div id="progress-wrap">
        <div id="progress-label">Ready</div>
        <div id="progress"><div></div></div>
      </div>
      <div id="hint">This mini test runs in a separate popup, so you can keep browsing other tabs while it measures speed.</div>
      <div class="row">
        <button id="start-btn">Start test</button>
        <button id="stop-btn" disabled>Stop</button>
      </div>
    </div>
  </div>
  <script src="speedtest.js"></script>
</body>
</html>
